<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reino do Dragão | Sistema de Reservas</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=MedievalSharp&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>


/* ==============================
   RESET
============================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* ==============================
   BODY
============================== */

body {

    font-family: 'Poppins', sans-serif;

    min-height: 100vh;

    color: #f5e6c8;

    overflow-x: hidden;

    position: relative;

    background:

    linear-gradient(
        rgba(0,0,0,0.88),
        rgba(10,0,0,0.94)
    ),

    url("https://static.wikia.nocookie.net/rpg-rise-of-the-titans/images/6/6e/DragonRed.jpg/revision/latest/scale-to-width-down/500?cb=20190222000049&path-prefix=pt-br");

    background-size: cover;

    background-position: center;

    background-attachment: fixed;
}


/* ==============================
   EFEITOS
============================== */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    background:

    radial-gradient(
        circle at top left,
        rgba(255,0,0,0.18),
        transparent 30%
    ),

    radial-gradient(
        circle at bottom right,
        rgba(255,120,0,0.15),
        transparent 35%
    ),

    radial-gradient(
        circle at center,
        rgba(255,255,255,0.03),
        transparent 45%
    );

    z-index: 0;

    pointer-events: none;
}


/* ==============================
   DRAGÕES
============================== */

.dragon {

    position: fixed;

    opacity: 0.10;

    z-index: 0;

    pointer-events: none;

    filter:
    drop-shadow(
        0 0 25px
        rgba(255,0,0,0.7)
    );
}


.dragon1 {

    width: 400px;

    top: 80px;

    left: -80px;

    animation: voar1 8s infinite ease-in-out;
}


.dragon2 {

    width: 360px;

    bottom: 40px;

    right: -60px;

    transform: scaleX(-1);

    animation: voar2 10s infinite ease-in-out;
}


.dragon3 {

    width: 260px;

    top: 45%;

    left: 38%;

    opacity: 0.05;

    animation: girar 20s linear infinite;
}


/* ==============================
   ANIMAÇÕES
============================== */

@keyframes voar1 {

    0% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-25px);
    }

    100% {
        transform: translateY(0);
    }

}


@keyframes voar2 {

    0% {
        transform:
        scaleX(-1)
        translateY(0);
    }

    50% {
        transform:
        scaleX(-1)
        translateY(-20px);
    }

    100% {
        transform:
        scaleX(-1)
        translateY(0);
    }

}


@keyframes girar {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* ==============================
   HEADER
============================== */

header {

    position: relative;

    z-index: 2;

    text-align: center;

    padding: 90px 20px;

    background:
    rgba(15,5,0,0.82);

    border-bottom:
    3px solid #8b0000;

    box-shadow:
    0 0 40px
    rgba(255,0,0,0.25);
}


header h1 {

    font-family:
    'MedievalSharp',
    cursive;

    font-size: 85px;

    color: #ffdf9d;

    letter-spacing: 6px;

    text-shadow:

    0 0 10px #ff7b00,

    0 0 20px #ff0000,

    0 0 50px #8b0000;
}


header p {

    margin-top: 20px;

    font-family: 'Cinzel', serif;

    letter-spacing: 4px;

    font-size: 22px;

    color: #f5d9b0;
}
