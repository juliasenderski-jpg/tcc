<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reino do Dragão | Painel dos Funcionários</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=MedievalSharp&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Poppins,sans-serif;color:#f5e6c8;background:linear-gradient(#080504e8,#100604f5),url('https://static.wikia.nocookie.net/rpg-rise-of-the-titans/images/6/6e/DragonRed.jpg/revision/latest/scale-to-width-down/500?cb=20190222000049&path-prefix=pt-br') center/cover fixed}header{text-align:center;padding:38px 16px;background:#100805e8;border-bottom:3px solid #8b0000}h1{font:clamp(38px,7vw,62px) MedievalSharp,cursive;color:#ffdf9d;margin:0;text-shadow:0 0 15px #8b0000}header p{font-family:Cinzel,serif;letter-spacing:2px}.container{width:min(1200px,94%);margin:28px auto}.card{background:#120c08f2;border:2px solid #7a1c00;border-radius:18px;padding:clamp(18px,3vw,30px);margin-bottom:22px}h2{font:600 25px Cinzel,serif;color:#ffcf8b;margin-top:0}.topo{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.sub,.muted{color:#d6b98a}.indicadores{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.indicador{text-align:center;padding:17px;background:#ff780012;border:1px solid #ff780033;border-radius:12px}.indicador span{display:block;color:#d6b98a;font-size:13px}.indicador strong{font:700 27px Cinzel,serif;color:#ffd89c}input{width:100%;padding:12px;border-radius:9px;border:1px solid #75401e;background:#1b130f;color:#fff;font:inherit}label{display:block;margin:10px 0 6px}button{padding:12px 16px;border:0;border-radius:9px;background:linear-gradient(45deg,#7a1c00,#c83a18);color:white;font-weight:600;cursor:pointer}.filtros{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin:18px 0}.reserva,.aviso{background:#1b120d;border-left:5px solid #d64a16;padding:17px;border-radius:10px;margin:12px 0}.reserva h3{color:#ffd89c;margin-top:0}.linhas{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}.recebido{font-size:12px;color:#bfa57c;border-top:1px solid #ffffff18;padding-top:10px;margin-bottom:0}.vazio{text-align:center;padding:24px;color:#d6b98a;border:1px dashed #75401e;border-radius:10px}.cancel{border-left-color:#a00000}.acoes{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:750px){.indicadores{grid-template-columns:1fr 1fr}.filtros{grid-template-columns:1fr}.linhas{grid-template-columns:1fr}}@media(max-width:430px){.indicadores{grid-template-columns:1fr}}
</style></head><body><header><h1>Reino do Dragão</h1><p>Painel dos Funcionários</p></header>
<main class="container"><section class="card"><div class="topo"><div><h2>Central de reservas</h2><p class="sub">As reservas feitas neste navegador aparecem aqui. Mantenha a página aberta para receber atualizações entre abas.</p></div><div class="acoes"><button id="atualizar">Atualizar</button><button id="cliente">Página do cliente</button></div></div>
<div class="indicadores"><div class="indicador"><span>Reservas ativas</span><strong id="ativas">0</strong></div><div class="indicador"><span>Pessoas reservadas</span><strong id="pessoas">0</strong></div><div class="indicador"><span>Limite diário</span><strong>48</strong></div><div class="indicador"><span>Cancelamentos</span><strong id="cancelamentos">0</strong></div></div></section>
<section class="card"><h2>Reservas recebidas</h2><div class="filtros"><div><label for="fData">Data</label><input type="date" id="fData"></div><div><label for="fNome">Cliente ou CPF</label><input type="search" id="fNome" placeholder="Pesquisar nome ou CPF..."></div><button id="limpar">Limpar filtros</button></div><div id="reservas"></div></section>
<section class="card"><h2>Notificações</h2><div id="avisos"></div></section></main>
<script>
const KR='reservasReinoDragoes',KA='avisosReinoDragoes',get=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return []}},digits=v=>String(v||'').replace(/\D/g,''),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),br=d=>d?d.split('-').reverse().join('/'):'',dt=v=>v?new Date(v).toLocaleString('pt-BR'):'—';
function atualizar(){const fd=document.getElementById('fData').value,fn=document.getElementById('fNome').value.trim().toLowerCase(),all=get(KR).filter(r=>r.status==='Confirmada'),avis=get(KA);document.getElementById('ativas').textContent=all.length;document.getElementById('pessoas').textContent=all.reduce((s,r)=>s+Number(r.pessoas||0),0);document.getElementById('cancelamentos').textContent=avis.filter(a=>a.tipo==='CANCELAMENTO').length;
const list=all.filter(r=>(!fd||r.data===fd)&&(!fn||String(r.nome||'').toLowerCase().includes(fn)||digits(r.cpf).includes(digits(fn)))).sort((a,b)=>a.data.localeCompare(b.data));const area=document.getElementById('reservas');area.innerHTML='';if(!list.length)area.innerHTML='<div class="vazio">Nenhuma reserva encontrada.</div>';else list.forEach(r=>{const d=document.createElement('div');d.className='reserva';d.innerHTML=`<h3>${esc(r.nome)} — CONFIRMADA</h3><div class="linhas"><p><b>Data:</b> ${br(r.data)}</p><p><b>Pessoas:</b> ${Number(r.pessoas)||0}</p><p><b>CPF:</b> ${esc(r.cpf||'Não informado')}</p><p><b>Telefone:</b> ${esc(r.telefone||'Não informado')}</p></div><p class="recebido">Recebida em ${dt(r.criadaEm)} • Código ${esc(r.id)}</p>`;area.appendChild(d)});
const av=document.getElementById('avisos');av.innerHTML='';const rev=avis.slice().reverse();if(!rev.length)av.innerHTML='<div class="vazio">Nenhuma notificação registrada.</div>';else rev.forEach(a=>{const d=document.createElement('div');d.className='aviso'+(a.tipo==='CANCELAMENTO'?' cancel':'');d.innerHTML=`<b>${a.tipo==='CANCELAMENTO'?'Cancelamento':'Nova reserva'}</b><p>${esc(a.mensagem)}</p><p><b>CPF:</b> ${esc(a.cpf||'Não informado')}</p><small>${dt(a.data)}</small>`;av.appendChild(d)})}
document.getElementById('atualizar').onclick=atualizar;document.getElementById('cliente').onclick=()=>location.href='Reino_do_Dragao_com_login_CPF%20back-end.html';document.getElementById('limpar').onclick=()=>{document.getElementById('fData').value='';document.getElementById('fNome').value='';atualizar()};document.getElementById('fData').onchange=atualizar;document.getElementById('fNome').oninput=atualizar;window.addEventListener('storage',e=>{if(!e.key||[KR,KA].includes(e.key))atualizar()});atualizar();
</script></body></html>
